# Added by RustDesk Server Max: builds custom clients on request of the web console.
name: RustDesk Server Max custom client
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that receives the packages
        required: true
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.tag }}
